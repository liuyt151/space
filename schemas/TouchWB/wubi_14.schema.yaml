# ===================================================
# 拇指布局输入方案 (14键布局优化版)
# author: Liuyt151
# date: 2026-05-15
# ===================================================
# 特性：
#   - 自动继承主方案所有功能
#   - 专为拇指输入优化添加 14 键位映射（w→q, r→e... ）
#   - 提高拇指输入效率
#   - 配合14键专用音辅版字典可有效降低重码。
# ===================================================

# 🔁 继承基础方案
__include: wubi.schema:/

schema:
  schema_id: &schema wubi_14
  name: "拇指五笔"

  author:
    - Liuyt151
    - https://github.com/liuyt151/TouchWubi
  description: |
    流萤
      流光一瞬，不羡永恒。
      萤火虽微，自照前程。
# 功能开关列表配置
switches:
  # 开关1：编码（五笔码）显示控制
  - name: new_hide_code
    reset: 1                # 默认值为0（显示字型编码）
    states: [ 显码, 隐码 ]
    comment: "显示/隐藏五笔字型编码（单字）"

  # 开关2：字根（部件拆分）显示控制
  - name: new_spelling
    reset: 0                # 默认值为1（显示部件拆分）
    states: [ 隐根, 显根 ]
    comment: "显示/隐藏汉字部件拆分（字根）"

  # 开关3：单字拼音显示控制
  - name: new_hide_pinyin
    reset: 1                # 默认值为0（显示带声调拼音）
    states: [ 显拼, 隐拼 ]
    comment: "显示/隐藏单字带声调拼音"

  # 开关4：配对标点控制（pair_symbol）
  - name: pair_symbol
    reset: 0                # 默认值为0（关闭配对）
    states: [ "关配", "开配" ]
    comment: "配对标点（括号、引号等自动成对）"

  # 开关5：超级提示控制（super_tips）
  - name: super_tips
    reset: 0                # 默认值为0（关闭提示）
    states: [ 关提, 开提 ]
    comment: "超级提示"

  # 开关6：中英转换控制（ce_trans）
  - name: ce_trans
    reset: 0                # 默认值为0（翻译关闭）
    states: [ 关译, 开译 ]
    comment: "中英文互译"

  # 开关7：字符集控制（GB2312）
  - name: GB2312
    reset: 1                # 默认值为0（扩展字符集）
    states: [ 扩展, 常用 ]
    comment: "常用字符集（GB2312）过滤"

  # 开关8：Emoji表情显示控制（show_es）
  - name: show_es
    reset: 0                # 默认值为0（隐藏表情）
    states: [ 隐表, 显表 ]
    comment: "Emoji 表情"

  # 开关9：简繁转换控制（zh_trad）
  - name: zh_trad
    reset: 0                # 默认值为0（简体）
    states: [ 简体, 繁体 ]
    comment: "简繁转换"

  # 开关10：标点符号全半角控制（ascii_punct）
  - name: ascii_punct
    reset: 0                # 默认值为0（全角标点）
    states: [ 。，,．， ]
    comment: "标点符号全角/半角"

  # 开关11：半/全角转换控制（full_shape）
  - name: full_shape
    reset: 0                # 默认值为0（半角字符）
    states: [ 半角, 全角 ]
    comment: "字符全角/半角"

engine:
  translators:
    - punct_translator
    - lua_translator@*input_statistics
    - lua_translator@*english_translator
    - table_translator
    - lua_translator@user_coined_translator
    - table_translator@fixed
    - table_translator@mkst
    - reverse_lookup_translator
    - lua_translator@*calculator
    - lua_translator@*schedule
    - lua_translator@*email_suffix_translator
# ========================================
# ⌨️ 拼写规则配置（Speller）
# ========================================
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba`/@=
  initials: zyxwvutsrqponmlkjihgfedcba`/@=
  delimiter: "`"
  max_code_length: 10000
  auto_select: false
  auto_clear: max_length
  auto_select_pattern: ^;.$|^\w{5}$
  algebra:
    - "derive/^\\/.*$//"
    - erase/^xx$/
    - "derive/^z$/*/"
    - "derive/^z(.*)$/$1/"
    - derive/w/q/
    - derive/r/e/
    - derive/y/t/
    - derive/i/u/
    - derive/p/o/
    - derive/s/a/
    - derive/f/d/
    - derive/h/g/
    - derive/k/j/
    - derive/c/x/
    - derive/b/v/
    - derive/m/n/
# ========================================
# 📚 翻译器配置（Translators）
# ========================================
translator:
  dictionary: wubi
  prism: *schema
  enable_user_dict: true
  encode_commit_history: true
  enable_encoder: true
  max_phrase_length: 4
  initial_quality: 500
  enable_completion: true
  enable_sentence: false
  enable_charset_filter: false
  disable_user_dict_for_patterns:
    - "^z.*$"
  comment_format:
    - xform/~//
    - 'xlit|abcdefghijklmnopqrstuvwxyz|ａｂｃｄｅｆｇｈｉｊｋｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ|'
